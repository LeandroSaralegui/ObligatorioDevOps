name: Build

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: "Entorno a desplegar (dev/test/prod)"
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - test
          - prod
          
permissions:
  contents: read
  security-events: write
  
jobs:
  build: 
    name: Build RetailStore
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Determinar entorno
        id: set-env
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "environment=${{ github.event.inputs.environment }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.ref_name }}" = "main" ]; then
            echo "environment=prod" >> $GITHUB_OUTPUT
          elif [ "${{ github.ref_name }}" = "staging" ]; then
            echo "environment=staging" >> $GITHUB_OUTPUT
          else
            echo "environment=dev" >> $GITHUB_OUTPUT
          fi
      - name: Validate Docker Compose configuration
        run: docker compose config
      
      - name: Build Docker images
        env:
          DOCKER_BUILDKIT: 1
        run: docker compose build
  quality:
    name: Analisis de Calidad - SonarCloud
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout codigo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          
  gitleaks:
    name: Gitleaks Secret Scan
    runs-on: ubuntu-latest
    needs: quality

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with: 
          fetch-depth: 0
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env: 
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
  trivy-fs:
    name: Trivy Filesystem Scan
    runs-on: ubuntu-latest
    needs: gitleaks

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy filesystem scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-fs-results.sarif
          severity: CRITICAL,HIGH
          exit-code: '0'
          ignore-unfixed: true

      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy-fs-results.sarif
  trivy-image:
    name: Trivy Image Scan
    runs-on: ubuntu-latest
    needs: trivy-fs

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Build Docker images
        run: docker compose build
        
      - name: Scan catalog image
        uses: aquasecurity/trivy-action@master
        with: 
          image-ref: obligatoriodevops-catalog:latest
          format: table
          severity: CRITICAL,HIGH
          exit-code: '0'
          ignore-unfixed: true
          
      - name: Scan carts image
        uses: aquasecurity/trivy-action@master
        with:
           image-ref: obligatoriodevops-orders:latest
           format: table
           severity: CRITICAL,HIGH
           exit-code: '0'
           ignore-unfixed: true
           
      - name: Scan orders image
        uses: aquasecurity/trivy-action@master
        with: 
          image-ref: obligatoriodevops-orders:latest
          format: table
          severity: CRITICAL,HIGH
          exit-code: '0'
          ignore-unfixed: true
          
      - name: Scan checkout image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: obligatoriodevops-checkout:latest
          format: table
          severity: CRITICAL,HIGH
          exit-code: '0'
          ignore-unfixed: true
          
      - name: Scan ui image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: obligatoriodevops-ui:latest
          format: table
          severity: CRITICAL,HIGH
          exit-code: '0'
          ignore-unfixed: true
          
      - name: Scan admin image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: obligatoriodevops-admin:latest
          format: table
          severity: CRITICAL,HIGH
          exit-code: '0'
          ignore-unfixed: true
          
  publish-ecr:
    name: Publish Images to Amazon ECR
    runs-on: ubuntu-latest
    needs: trivy-image

    env:
      AWS_REGION: us-east-1
      ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}
      PROJECT_NAME: retailstore

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and Push Images
        run: |
          services=("admin" "carts" "catalog" "checkout" "orders" "ui")

          for service in "${services[@]}"
          do
            echo "Building $service"

            docker build \
              -t obligatoriodevops-$service:latest \
              ./src/$service

            docker tag \
              obligatoriodevops-$service:latest \
              $ECR_REGISTRY/$PROJECT_NAME/$service:latest

            docker push \
              $ECR_REGISTRY/$PROJECT_NAME/$service:latest
          done         
