name: Build

on:
  workflow_dispatch:
    
  pull_request:
    branches: [main]
  push:
    branches: [main]
    
permissions:
  contents: read
  security-events: write
  
jobs:
  build: 
    name: Build RetailStore
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Docker Compose configuration
        run: docker compose config
      
      - name: Build Docker images
        run: docker compose build
  quality:
    name: Analisis de Calidad - SonarCloud
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout codigo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          
  gitleaks:
    name: Gitleaks Secret Scan
    runs-on: ubuntu-latest
    needs: quality

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with: 
          fetch-depth: 0
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env: 
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
  trivy-fs:
    name: Trivy Filesystem Scan
    runs-on: ubuntu-latest
    needs: gitleaks

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy filesystem scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-fs-results.sarif
          severity: CRITICAL,HIGH
          exit-code: '0'
          ignore-unfixed: true

      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy-fs-results.sarif
  trivy-image:
    name: Trivy Image Scan
    runs-on: ubuntu-latest
    needs: trivy-fs

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Build Docker images
        run: docker compose build
        
      - name: Scan catalog image
        uses: aquasecurity/trivy-action@master
        with: 
          image-ref: obligatoriodevops-catalog:latest
          format: table
          severity: CRITICAL,HIGH
          exit-code: '0'
          ignore-unfixed: true
          
      - name: Scan carts image
        uses: aquasecurity/trivy-action@master
        with:
           image-ref: obligatoriodevops-orders:latest
           format: table
           severity: CRITICAL,HIGH
           exit-code: '0'
           ignore-unfixed: true
           
      - name: Scan orders image
        uses: aquasecurity/trivy-action@master
        with: 
          image-ref: obligatoriodevops-orders:latest
          format: table
          severity: CRITICAL,HIGH
          exit-code: '0'
          ignore-unfixed: true
          
      - name: Scan checkout image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: obligatoriodevops-checkout:latest
          format: table
          severity: CRITICAL,HIGH
          exit-code: '0'
          ignore-unfixed: true
          
      - name: Scan ui image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: obligatoriodevops-ui:latest
          format: table
          severity: CRITICAL,HIGH
          exit-code: '0'
          ignore-unfixed: true
          
      - name: Scan admin image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: obligatoriodevops-admin:latest
          format: table
          severity: CRITICAL,HIGH
          exit-code: '0'
          ignore-unfixed: true
          
